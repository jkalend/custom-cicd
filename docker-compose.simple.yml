services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cicd-backend
    # Only expose internally
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATA_FILE=/app/data/agent_data.json
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
    volumes:
      - backend_data:/app/data
    networks:
      - cicd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cicd-frontend
    ports:
      - "3000:3000"  # Expose frontend (which will proxy API calls)
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cicd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cicd-network:
    driver: bridge
    name: cicd-network

volumes:
  backend_data:
    name: cicd-backend-data
