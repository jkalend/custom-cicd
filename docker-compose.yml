services:
  # API Gateway (nginx reverse proxy)
  gateway:
    image: nginx:alpine
    container_name: cicd-gateway
    ports:
      - "80:80"      # Single entry point for everything
      - "443:443"    # HTTPS (if needed)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cicd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cicd-backend
    # Only expose internally - no direct external access
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATA_FILE=/app/data/agent_data.json
      - LAYA_GATEWAY_URL=${LAYA_GATEWAY_URL:-http://host.docker.internal:8128/v1/evaluate}
      - LAYA_GATEWAY_TOKEN=${LAYA_GATEWAY_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
    networks:
      - cicd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cicd-frontend
    # Only expose internally - accessed via gateway
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000  # Internal communication
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cicd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  cicd-network:
    driver: bridge
    name: cicd-network

volumes:
  backend_data:
    name: cicd-backend-data
